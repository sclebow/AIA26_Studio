<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TerraPilot — Animated Logo</title>
<!--
  Animated TerraPilot logo, themed to the interface (deep navy + cyan/violet).
  Self-contained: open in a browser to play, or screen-record it for a video intro.
  The mark = a stack of floor plates rising into the ▲ pilot triangle, ringed by an
  orbiting site/context node — "a building, generated and piloted on a real site".
-->
<style>
  :root{
    --bg:#070b14; --cyan:#28e0d0; --cyan2:#57f2e6; --violet:#7c7bff;
    --ink:#eaf2ff; --muted:#8b97ad;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{height:100%;background:var(--bg);}   /* base navy only — no gradient here */
  /* background MATCHED to terrapilot-background.png: deep navy + cyan glow top-left +
     violet glow bottom-right + faint cyan/violet blueprint grid + twinkling stars.
     A single FIXED full-viewport layer (.bg-glow) carries the gradients so there's no
     seam from html/body stacking the same gradient (that caused the centre band). */
  body{min-height:100vh;display:grid;place-items:center;overflow:hidden;
    font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);}
  .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(900px 680px at 16% 18%, rgba(40,224,208,0.14), transparent 62%),
      radial-gradient(900px 700px at 84% 82%, rgba(124,123,255,0.16), transparent 62%);}
  /* the blueprint grid (same as the background png) */
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:
      linear-gradient(rgba(40,224,208,0.06) 1px,transparent 1px),
      linear-gradient(90deg,rgba(124,123,255,0.06) 1px,transparent 1px);
    background-size:58px 58px;
    -webkit-mask-image:radial-gradient(circle at 50% 45%,#000,transparent 92%);
            mask-image:radial-gradient(circle at 50% 45%,#000,transparent 92%);}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none;}
  #stars i{position:absolute;border-radius:50%;background:var(--cyan2);
    box-shadow:0 0 6px rgba(87,242,230,.9);
    animation:twinkle 5s ease-in-out infinite;}
  @keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.85}}
  .stage{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:30px;}
  svg{display:block;overflow:visible;}


  /* ---------- the mark ---------- */
  /* each floor plate rises + fades in, bottom to top */
  .plate{transform-box:fill-box;transform-origin:center;opacity:0;
    animation:plate-rise .7s cubic-bezier(.2,.7,.3,1) forwards;}
  .plate.p0{animation-delay:.15s}
  .plate.p1{animation-delay:.30s}
  .plate.p2{animation-delay:.45s}
  .plate.p3{animation-delay:.60s}
  @keyframes plate-rise{
    0%{opacity:0;transform:translateY(26px) scaleX(.6)}
    60%{opacity:1}
    100%{opacity:1;transform:translateY(0) scaleX(1)}}

  /* the pilot triangle draws on, then glows */
  .tri{stroke:var(--cyan2);stroke-width:3;fill:rgba(40,224,208,0.14);
    stroke-dasharray:240;stroke-dashoffset:240;
    animation:tri-draw .8s ease .8s forwards, tri-glow 2.6s ease-in-out 1.7s infinite;}
  @keyframes tri-draw{to{stroke-dashoffset:0}}
  @keyframes tri-glow{0%,100%{filter:drop-shadow(0 0 4px rgba(40,224,208,.5))}
    50%{filter:drop-shadow(0 0 16px rgba(87,242,230,.95))}}

  /* radar "scan the site" pulses — concentric rings rippling outward from the mark.
     Clearly reads as "AI analysing the site", not a stray dot. */
  .pulse-ring{fill:none;stroke:var(--cyan2);stroke-width:2;
    transform-box:fill-box;transform-origin:center;opacity:0;
    animation:radar 3.4s ease-out infinite;}
  .pulse-ring.r2{animation-delay:1.1s}
  .pulse-ring.r3{animation-delay:2.2s}
  @keyframes radar{0%{opacity:.7;transform:scale(.35)}
    70%{opacity:.12}100%{opacity:0;transform:scale(1.15)}}

  /* ---------- wordmark ---------- */
  .word{font-size:54px;font-weight:800;letter-spacing:.5px;opacity:0;
    animation:word-in .8s ease 1.0s forwards;}
  .word .terra{fill:var(--ink)}
  .word .pilot{fill:var(--cyan2)}
  @keyframes word-in{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:translateY(0)}}
  .tag{fill:var(--cyan);font-size:13px;letter-spacing:6px;font-weight:600;opacity:0;
    animation:word-in .8s ease 1.35s forwards;}

  /* a scan line that sweeps TOP -> BOTTOM (reading the building, architectural feel),
     then repeats every few seconds like a live scanner. */
  .scan{fill:url(#sweepGrad);opacity:0;mix-blend-mode:screen;
    animation:scan 3.4s ease 1.9s infinite;}
  @keyframes scan{0%{opacity:0;transform:translateY(-40px)}
    8%{opacity:.85}50%{opacity:.85}70%{opacity:0;transform:translateY(230px)}
    100%{opacity:0;transform:translateY(230px)}}

  @media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;stroke-dashoffset:0!important}}
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="bg-grid"></div>
<div id="stars"></div>
<div class="stage">
  <!-- MARK -->
  <svg width="260" height="260" viewBox="0 0 260 260" aria-label="TerraPilot mark">
    <defs>
      <linearGradient id="plateGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#57f2e6"/><stop offset="1" stop-color="#28e0d0"/>
      </linearGradient>
      <!-- vertical gradient so a horizontal scan band glows soft top+bottom -->
      <linearGradient id="sweepGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="rgba(87,242,230,0)"/>
        <stop offset=".5" stop-color="rgba(120,235,255,.7)"/>
        <stop offset="1" stop-color="rgba(87,242,230,0)"/>
      </linearGradient>
      <clipPath id="markClip"><rect x="0" y="0" width="260" height="260"/></clipPath>
    </defs>

    <!-- (inner grid removed — the full-page background grid already provides it) -->

    <!-- radar pulses rippling outward = "AI scanning the site" -->
    <circle class="pulse-ring r1" cx="130" cy="130" r="96"/>
    <circle class="pulse-ring r2" cx="130" cy="130" r="96"/>
    <circle class="pulse-ring r3" cx="130" cy="130" r="96"/>

    <!-- floor-plate stack rising into the triangle -->
    <g clip-path="url(#markClip)">
      <rect class="plate p0" x="78"  y="182" width="104" height="20" rx="3" fill="url(#plateGrad)"/>
      <rect class="plate p1" x="88"  y="158" width="84"  height="20" rx="3" fill="url(#plateGrad)" opacity=".95"/>
      <rect class="plate p2" x="98"  y="134" width="64"  height="20" rx="3" fill="url(#plateGrad)" opacity=".9"/>
      <rect class="plate p3" x="108" y="110" width="44"  height="20" rx="3" fill="url(#plateGrad)" opacity=".85"/>
    </g>

    <!-- the pilot triangle (caps the stack) -->
    <polygon class="tri" points="130,52 168,104 92,104"/>

    <!-- scan line: a horizontal band that sweeps TOP -> BOTTOM (reads the building) -->
    <rect class="scan" x="60" y="34" width="140" height="22" rx="4"/>
  </svg>

  <!-- WORDMARK -->
  <svg width="520" height="100" viewBox="0 0 520 100" aria-label="TerraPilot">
    <text class="word" x="260" y="52" text-anchor="middle">
      <tspan class="terra">Terra</tspan><tspan class="pilot">Pilot</tspan>
    </text>
    <text class="tag" x="260" y="84" text-anchor="middle">AI-DRIVEN ARCHITECTURAL DESIGN</text>
  </svg>
</div>
<script>
  // scatter twinkling stars, matching the background png look
  (function(){
    const s=document.getElementById('stars');
    for(let i=0;i<70;i++){
      const d=document.createElement('i');
      const sz=1+Math.round(Math.random()*2.2);
      d.style.left=(Math.random()*100)+'%';
      d.style.top=(Math.random()*100)+'%';
      d.style.width=sz+'px'; d.style.height=sz+'px';
      d.style.animationDelay=(Math.random()*5)+'s';
      s.appendChild(d);
    }
  })();
</script>
</body>
</html>
