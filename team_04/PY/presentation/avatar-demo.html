<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerraPilot · Avatar Demo</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#070b18;color:#e8edf7;overflow:hidden;
    font-family:-apple-system,"Segoe UI",Inter,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh}
  .bg-glow{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(800px 600px at 40% 35%,rgba(52,227,208,.10),transparent 60%),
               radial-gradient(700px 500px at 78% 70%,rgba(124,123,255,.10),transparent 60%)}
  #stars{position:fixed;inset:0;pointer-events:none}

  .stage{position:relative;width:min(1000px,94vw);height:min(620px,86vh);z-index:2}

  /* ---------- the holographic tablet ---------- */
  .tablet{position:absolute;left:2%;top:6%;width:62%;height:84%;
    border:2px solid #34e3d0;border-radius:22px;background:rgba(8,22,30,.85);
    box-shadow:0 0 60px rgba(52,227,208,.25),inset 0 0 40px rgba(52,227,208,.06);
    transform:perspective(1200px) rotateY(9deg) rotateX(3deg);overflow:hidden}
  .topbar{height:38px;border-bottom:1px solid rgba(52,227,208,.25);display:flex;align-items:center;gap:6px;padding:0 14px}
  .topbar .tab{width:26px;height:7px;border-radius:4px;background:rgba(52,227,208,.4)}
  .topbar .dots{margin-left:auto;display:flex;gap:5px}
  .topbar .dots i{width:6px;height:6px;border-radius:50%;background:#34e3d0;opacity:.7}
  .body{display:flex;height:calc(100% - 38px)}
  .side{width:62px;border-right:1px solid rgba(52,227,208,.18);padding:12px 8px;display:flex;flex-direction:column;gap:9px}
  .side .it{height:10px;border-radius:5px;background:rgba(52,227,208,.18)}
  .side .it.on{background:#34e3d0;box-shadow:0 0 10px #34e3d0}
  .canvas{flex:1;position:relative;overflow:hidden}
  .floor{position:absolute;left:50%;top:54%;transform:translate(-50%,-50%) rotateX(58deg);
    width:300px;height:300px;
    background:
      linear-gradient(rgba(52,227,208,.16) 1px,transparent 1px) 0 0/26px 26px,
      linear-gradient(90deg,rgba(52,227,208,.16) 1px,transparent 1px) 0 0/26px 26px;
    border:1px solid rgba(52,227,208,.35);border-radius:6px;
    box-shadow:0 0 50px rgba(52,227,208,.3)}

  /* the building (CSS isometric L-shape that builds up) */
  .bld{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);
    width:160px;height:160px;opacity:0;transition:opacity .6s}
  .bld.show{opacity:1}
  .plate{position:absolute;left:50%;transform:translateX(-50%) rotateX(58deg);
    background:linear-gradient(180deg,#eafffb,#9be9df);
    border:1px solid #2bbfb0;box-shadow:0 0 18px rgba(52,227,208,.5);
    opacity:0;transition:all .5s cubic-bezier(.22,.61,.36,1);
    /* L-shape via clip */
    clip-path:polygon(0 0,100% 0,100% 55%,55% 55%,55% 100%,0 100%)}
  .bld.show .plate{opacity:1}

  /* prompt chip + caret */
  .promptbox{position:absolute;left:14px;bottom:14px;right:14px;height:34px;border-radius:9px;
    border:1px solid rgba(52,227,208,.4);background:rgba(8,22,30,.9);display:flex;align-items:center;
    padding:0 12px;color:#9fe8dd;font-size:13px;font-style:italic;gap:2px}
  .caret{width:2px;height:16px;background:#34e3d0;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .health{position:absolute;right:12px;top:50px;width:108px;border:1px solid rgba(52,227,208,.3);
    border-radius:10px;background:rgba(8,22,30,.85);padding:8px;font-size:9px;color:#9fe8dd}
  .hrow{display:flex;align-items:center;gap:5px;margin:4px 0}
  .htrack{flex:1;height:5px;border-radius:3px;background:rgba(52,227,208,.15);overflow:hidden}
  .hfill{height:100%;width:0;border-radius:3px;transition:width 1s ease}

  /* ---------- the robot avatar (right side, pointing) ---------- */
  .bot{position:absolute;right:1%;top:18%;width:200px;animation:hover 3.4s ease-in-out infinite}
  @keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .bot svg{width:100%;filter:drop-shadow(0 14px 22px rgba(52,227,208,.2))}
  .arm{transform-origin:150px 250px;animation:point 5s ease-in-out infinite}
  @keyframes point{0%,100%{transform:rotate(6deg)}45%,70%{transform:rotate(-12deg)}}
  .antd{animation:apulse 1.7s ease-in-out infinite}
  @keyframes apulse{0%,100%{opacity:.6}50%{opacity:1}}
  .eyes{transform-origin:center;animation:blink2 4s infinite}
  @keyframes blink2{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}

  /* speech bubble from the bot */
  .speech{position:absolute;right:6%;top:6%;max-width:230px;background:#0d1f29;border:1px solid #34e3d0;
    border-radius:14px;padding:12px 14px;color:#dff6ea;font-size:13px;line-height:1.4;
    box-shadow:0 8px 30px rgba(0,0,0,.4);opacity:0;transform:translateY(8px);transition:all .5s}
  .speech.show{opacity:1;transform:none}
  .speech b{color:#5cf0e0}
  .speech::after{content:"";position:absolute;left:-8px;top:30px;border:8px solid transparent;border-right-color:#34e3d0}

  .caption{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);color:#5a6b85;
    font-size:12px;letter-spacing:.06em;z-index:5}
</style>
</head>
<body>
  <div class="bg-glow"></div><canvas id="stars"></canvas>

  <div class="stage">
    <!-- TABLET -->
    <div class="tablet">
      <div class="topbar">
        <span class="tab"></span><span class="tab"></span><span class="tab"></span><span class="tab"></span>
        <span class="dots"><i></i><i></i><i></i></span>
      </div>
      <div class="body">
        <div class="side" id="side">
          <span class="it on"></span><span class="it"></span><span class="it"></span>
          <span class="it"></span><span class="it"></span><span class="it"></span>
        </div>
        <div class="canvas">
          <div class="floor"></div>
          <div class="bld" id="bld"><div class="plate" id="plate" style="width:120px;height:120px"></div></div>
          <div class="health" id="health" style="opacity:0;transition:opacity .5s">
            <div style="color:#5cf0e0;font-weight:700;margin-bottom:3px">Design Health</div>
            <div class="hrow">☀<span class="htrack"><i class="hfill" style="background:#ffd166" data-w="66"></i></span></div>
            <div class="hrow">👁<span class="htrack"><i class="hfill" style="background:#57f2e6" data-w="92"></i></span></div>
            <div class="hrow">🔊<span class="htrack"><i class="hfill" style="background:#7c7bff" data-w="20"></i></span></div>
          </div>
          <div class="promptbox"><span id="prompt"></span><span class="caret"></span></div>
        </div>
      </div>
    </div>

    <!-- SPEECH BUBBLE -->
    <div class="speech" id="speech"></div>

    <!-- ROBOT -->
    <div class="bot">
      <svg viewBox="0 0 300 360">
        <defs>
          <linearGradient id="hd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141a2c"/><stop offset="1" stop-color="#0c1120"/></linearGradient>
          <linearGradient id="ey" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5cf0e0"/><stop offset="1" stop-color="#1bbfae"/></linearGradient>
        </defs>
        <line x1="150" y1="70" x2="150" y2="42" stroke="#34e3d0" stroke-width="4" stroke-linecap="round"/>
        <circle class="antd" cx="150" cy="36" r="9" fill="#7c7bff"/>
        <ellipse cx="64" cy="186" rx="24" ry="30" fill="url(#hd)" stroke="#34e3d0" stroke-width="4"/><circle cx="64" cy="186" r="7" fill="#7c7bff"/>
        <ellipse cx="236" cy="186" rx="24" ry="30" fill="url(#hd)" stroke="#34e3d0" stroke-width="4"/><circle cx="236" cy="186" r="7" fill="#7c7bff"/>
        <rect x="62" y="72" width="176" height="176" rx="32" fill="url(#hd)" stroke="#34e3d0" stroke-width="5"/>
        <rect x="88" y="100" width="124" height="116" rx="22" fill="#0a1020" stroke="#1d6f68" stroke-width="3"/>
        <g class="eyes">
          <ellipse cx="125" cy="150" rx="16" ry="21" fill="url(#ey)"/><ellipse cx="175" cy="150" rx="16" ry="21" fill="url(#ey)"/>
          <circle cx="120" cy="143" r="5" fill="#eafffb"/><circle cx="170" cy="143" r="5" fill="#eafffb"/>
        </g>
        <circle cx="104" cy="184" r="5" fill="#7c7bff"/><circle cx="196" cy="184" r="5" fill="#7c7bff"/>
        <path d="M128 190 Q150 208 172 190" fill="none" stroke="#34e3d0" stroke-width="5" stroke-linecap="round"/>
        <path d="M108 250 L192 250 L208 308 L92 308 Z" fill="url(#hd)" stroke="#34e3d0" stroke-width="4"/>
        <polygon points="150,266 167,298 133,298" fill="none" stroke="#5cf0e0" stroke-width="3"/>
        <!-- pointing arm -->
        <g class="arm">
          <line x1="150" y1="250" x2="60" y2="250" stroke="#34e3d0" stroke-width="9" stroke-linecap="round"/>
          <circle cx="52" cy="250" r="12" fill="#0c1120" stroke="#34e3d0" stroke-width="4"/>
        </g>
      </svg>
    </div>
  </div>

  <div class="caption" id="cap">TerraPilot demo</div>

<script>
  // starfield
  const c=document.getElementById('stars'),x=c.getContext('2d');
  function sz(){c.width=innerWidth;c.height=innerHeight;}sz();addEventListener('resize',sz);
  const st=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,a:Math.random()*.5+.2}));
  (function L(t){x.clearRect(0,0,c.width,c.height);for(const s of st){const tw=s.a+Math.sin(t/700+s.x*12)*.2;
    x.beginPath();x.arc(s.x*c.width,s.y*c.height,s.r,0,7);x.fillStyle=`rgba(150,190,255,${Math.max(0,tw)})`;x.fill();}requestAnimationFrame(L);})(0);

  // ---- demo script ----
  const promptEl=document.getElementById('prompt'),speech=document.getElementById('speech'),
        bld=document.getElementById('bld'),plate=document.getElementById('plate'),
        health=document.getElementById('health'),cap=document.getElementById('cap');
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  async function type(s){promptEl.textContent='';for(const ch of s){promptEl.textContent+=ch;await sleep(38);}}
  function say(html){speech.innerHTML=html;speech.classList.add('show');}
  function fillHealth(){document.querySelectorAll('.hfill').forEach(f=>f.style.width=f.dataset.w+'%');}

  async function run(){
    while(true){
      // reset
      bld.classList.remove('show'); health.style.opacity=0; speech.classList.remove('show');
      plate.style.width='120px'; plate.style.height='120px'; plate.style.filter='';
      cap.textContent='TerraPilot demo';
      await sleep(900);

      // 1 — generate
      say('Hi! I\'m <b>TerraPilot</b>. Just tell me what to build.');
      await sleep(900);
      await type('Design me an L-shaped building');
      await sleep(500);
      cap.textContent='① Generating massing on the real site…';
      bld.classList.add('show');
      await sleep(1400);

      // 2 — health
      say('I scored it against your site — <b>sun, view & noise</b>, live.');
      health.style.opacity=1; fillHealth();
      cap.textContent='② Live design health';
      await sleep(1800);

      // 3 — manipulate (twist/grow)
      await type('Make it taller and futuristic');
      await sleep(400);
      plate.style.width='150px'; plate.style.height='150px'; plate.style.filter='hue-rotate(-12deg) brightness(1.1)';
      say('Done — I twisted the massing and kept it <b>inside the setback</b>.');
      cap.textContent='③ Manipulate by talking to it';
      await sleep(2000);

      // 4 — optimize
      await type('Optimize the placement');
      await sleep(400);
      bld.style.transition='left .9s ease'; bld.style.left='42%';
      say('Here are the best placements, <b>ranked & compared</b>.');
      cap.textContent='④ Multi-objective optimization';
      await sleep(2000);
      bld.style.left='50%';

      say('From a sentence to a <b>site-aware, validated</b> building. 🚀');
      cap.textContent='TerraPilot — your AI design co-pilot';
      await sleep(2600);
    }
  }
  run();
</script>
</body>
</html>
