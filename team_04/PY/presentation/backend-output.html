<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TerraPilot · Real Backend Output</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#070b18;color:#e8edf7;
    font-family:-apple-system,"Segoe UI",Inter,Roboto,system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:auto;
  }
  .bg-grid{position:fixed;inset:0;z-index:0;pointer-events:none;
    background-image:linear-gradient(rgba(90,140,210,.06) 1px,transparent 1px),
                     linear-gradient(90deg,rgba(90,140,210,.06) 1px,transparent 1px);
    background-size:46px 46px;animation:drift 18s linear infinite;}
  @keyframes drift{to{background-position:46px 46px,46px 46px}}
  .bg-glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:radial-gradient(900px 600px at 72% 18%,rgba(60,160,255,.10),transparent 60%),
               radial-gradient(800px 600px at 18% 95%,rgba(124,123,255,.10),transparent 60%);}
  #stars{position:fixed;inset:0;z-index:0;pointer-events:none}

  .slide{position:relative;z-index:2;width:min(1280px,95vw);padding:3.2vh 3.5vw;}
  .kicker{font-size:.8rem;letter-spacing:.22em;text-transform:uppercase;color:#5fd1c3;font-weight:700;margin-bottom:.7rem}
  h2{font-size:clamp(1.4rem,3.2vw,2.3rem);font-weight:800;line-height:1.12;margin-bottom:.3rem}
  .hl{color:#57f2e6}
  .sub{color:#8a96b4;font-size:.92rem;margin-bottom:2vh}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1.3rem}
  figure{border:1px solid rgba(120,160,220,.22);border-radius:14px;overflow:hidden;
         background:rgba(20,30,55,.35);display:flex;flex-direction:column;
         opacity:0;transform:translateY(14px);animation:in .55s cubic-bezier(.22,.61,.36,1) forwards}
  figure:nth-child(2){animation-delay:.12s}figure:nth-child(3){animation-delay:.24s}figure:nth-child(4){animation-delay:.36s}
  @keyframes in{to{opacity:1;transform:none}}
  figure.wide{grid-column:1 / -1}
  .imgwrap{background:#0c1322;display:flex;align-items:center;justify-content:center;padding:.5rem}
  img{max-width:100%;max-height:340px;display:block;object-fit:contain}
  figure.wide img{max-height:300px}
  figcaption{padding:.6rem .9rem;border-top:1px solid rgba(120,160,220,.16)}
  figcaption b{color:#dfe7f6;font-size:.95rem}
  figcaption small{display:block;color:#8a96b4;font-size:.78rem;margin-top:.15rem}
  .used{margin-top:.45rem;display:flex;flex-wrap:wrap;gap:.35rem}
  .used .t{font-size:.68rem;font-weight:700;letter-spacing:.02em;color:#9fe8dd;
    border:1px solid rgba(87,242,230,.32);background:rgba(40,224,208,.07);
    border-radius:6px;padding:.12rem .45rem}
  .used .lbl{font-size:.68rem;color:#6f7c98;align-self:center;margin-right:.1rem}
</style>
</head>
<body>
  <div class="bg-glow"></div>
  <div class="bg-grid"></div>
  <canvas id="stars"></canvas>

  <section class="slide">
    <div class="kicker">Under Hood · Proof</div>
    <h2>Real <span class="hl">backend output</span> — not mockups</h2>
    <div class="sub">Every chart below is generated by the same Python tools the live interface calls.</div>

    <div class="grid">
      <figure>
        <div class="imgwrap"><img src="notebook_07_site_setbacks_buildable_zone.png" alt="Site setbacks & buildable zone"></div>
        <figcaption><b>Site setbacks → buildable zone</b><small>The dashed setback line you see in the 3D viewer, computed from real rules.</small>
          <div class="used"><span class="lbl">used:</span><span class="t">Shapely</span><span class="t">site_setback</span><span class="t">compute_buildable_zone</span></div></figcaption>
      </figure>

      <figure>
        <div class="imgwrap"><img src="notebook_03_pareto_free_shape_placements.png" alt="Valid placement sweep / Pareto"></div>
        <figcaption><b>Placement sweep + Pareto front</b><small>NSGA-II searches valid placements inside the buildable zone.</small>
          <div class="used"><span class="lbl">used:</span><span class="t">pymoo NSGA-II</span><span class="t">sample_valid_placements</span><span class="t">matplotlib</span></div></figcaption>
      </figure>

      <figure class="wide">
        <div class="imgwrap"><img src="notebook_05_per_objective_b1_vs_b2.png" alt="Per-objective scores"></div>
        <figcaption><b>Per-objective scoring</b><small>Each option scored across the objective set — this is what drives the ranking &amp; the comparison table.</small>
          <div class="used"><span class="lbl">used:</span><span class="t">view_optimizer</span><span class="t">multi-objective scorers</span><span class="t">matplotlib</span></div></figcaption>
      </figure>

      <figure class="wide">
        <div class="imgwrap"><img src="notebook_08_pareto_with_setbacks_clearance.png" alt="Pareto front with setbacks & clearance"></div>
        <figcaption><b>Top Pareto solutions — with setbacks + 6 m clearance</b><small>Two-building optimization that respects setbacks and inter-building clearance.</small>
          <div class="used"><span class="lbl">used:</span><span class="t">pymoo NSGA-II</span><span class="t">optimize_two_building_placement</span><span class="t">Shapely</span></div></figcaption>
      </figure>
    </div>
  </section>

<script>
  const c=document.getElementById('stars'),x=c.getContext('2d');
  function size(){c.width=innerWidth;c.height=innerHeight;}
  size();addEventListener('resize',size);
  const stars=Array.from({length:90},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.4+.3,a:Math.random()*.5+.2}));
  (function loop(t){
    x.clearRect(0,0,c.width,c.height);
    for(const st of stars){const tw=st.a+Math.sin(t/700+st.x*12)*.2;
      x.beginPath();x.arc(st.x*c.width,st.y*c.height,st.r,0,7);
      x.fillStyle=`rgba(150,190,255,${Math.max(0,tw)})`;x.fill();}
    requestAnimationFrame(loop);
  })(0);
</script>
</body>
</html>
